name: checks
on: [push, pull_request, workflow_dispatch]
jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_names.py .
      - run: test -z "$(git ls-files | sort -f | uniq -Di)"   # no two paths differ only by case (macOS, Windows)
  statement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
      - run: ~/.elan/bin/lake exe cache get
      - run: ~/.elan/bin/lake build Challenge   # Statement.lean and Challenge.lean only
